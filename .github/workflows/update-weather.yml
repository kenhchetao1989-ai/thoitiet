name: Update weather data

on:
  # Re-run the updater automatically when its implementation changes.
  push:
    paths:
      - 'scripts/update_data.py'
      - '.github/workflows/update-weather.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate updater syntax
        run: python -m py_compile scripts/update_data.py
      - name: Refresh static JSON
        run: python scripts/update_data.py
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weather.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update weather data'
          git push
